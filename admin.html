<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Botany Admin Dashboard</title>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#c8f7a6,#8fdc7f);
}

.header{
background:#1b5e20;
color:white;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.container{
max-width:1200px;
margin:30px auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.card h2{
margin-top:0;
color:#1b5e20;
}

.stat{
font-size:40px;
font-weight:bold;
color:#2e7d32;
}

.btn{
display:inline-block;
margin-top:10px;
padding:12px 20px;
background:#2e7d32;
color:white;
text-decoration:none;
border-radius:10px;
}

.btn:hover{
background:#1b5e20;
}

</style>

</head>

<body>

<div class="header">
🌿 Botany Admin Dashboard
</div>

<div class="container">

<div class="grid">

<div class="card">
<h2>Total Questions</h2>
<div class="stat">20</div>
</div>

<div class="card">
<h2>Total Attempts</h2>
<div class="stat">0</div>
</div>

<div class="card">
<h2>Average Score</h2>
<div class="stat">0</div>
</div>

<div class="card">
<h2>Top Score</h2>
<div class="stat">0</div>
</div>

<div class="card">
<h2>Practice Mode</h2>

<p>
Topic-wise quizzes and revision.
</p>

<a href="index.html" class="btn">
Start Practice
</a>

</div>

<div class="card">
<h2>Question Bank</h2>

<p>
Manage CSIR NET, CUET PG and GATE questions.
</p>

<a href="#" class="btn">
Coming Soon
</a>

</div>

</div>

</div>

</body>
</html>
